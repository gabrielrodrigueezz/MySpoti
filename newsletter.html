<!doctype html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Newsletter — Anuel AA</title>
  <link rel="icon" href="assets/favicon.ico">
</head>
<body>
  <header>
    <h1>Suscríbete a la Newsletter de Anuel AA</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="discografia.html">Discografía</a></li>
        <li><a href="newsletter.html">Newsletter</a></li>
        <li><a href="./album1.html">Album1</a></li>
        <li><a href="./album2.html">Album2</a></li>
        <li><a href="./album3.html">Album3</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article>
      <h2>Formulario de registro</h2>
      <form action="#" method="post">
        <div>
          <label for="nombre">Nombre </label>
          <input id="nombre" name="nombre" type="text" required>
        </div>
        <div>
          <label for="apellidos">Apellidos </label>
          <input id="apellidos" name="apellidos" type="text" required>
        </div>
        <div>
          <label for="edad">Edad </label>
          <input id="edad" name="edad" type="number" min="13" max="120" required>
        </div>
        <div>
          <label for="pais">País </label>
          <select id="pais" name="pais" required>
            <option value="">-- Selecciona --</option>
            <option value="pr">Puerto Rico</option>
            <option value="es">España</option>
            <option value="mx">México</option>
            <option value="ar">Argentina</option>
          </select>
        </div>
        <div>
          <label for="correo">Correo electrónico </label>
          <input id="correo" name="correo" type="email" required placeholder="ejemplo@email.com">
        </div>

        <fieldset>
          <legend>Intereses</legend>
          <label><input type="checkbox" name="interes" value="nuevas"> Nuevos lanzamientos</label><br>
          <label><input type="checkbox" name="interes" value="conciertos"> Conciertos</label><br>
          <label><input type="checkbox" name="interes" value="merch"> Merchandising</label>
        </fieldset>

        <button type="submit">Enviar</button>
      </form>
    </article>
  </main>
</body>
</html>
